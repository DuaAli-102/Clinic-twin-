name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: |
          mkdir www
          cp index.html manifest.json sw.js icon-192.png icon-512.png www/
      - run: npx cap add android
      - name: Add camera and vibrate permissions
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <application#' android/app/src/main/AndroidManifest.xml
      - run: npx cap sync android
      - run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ClinicTwin-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1
          name: Clinic Twin APK
          files: android/app/build/outputs/apk/debug/app-debug.apk
